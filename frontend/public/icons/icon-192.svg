<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>
  
  <!-- Outer glowing shield emblem -->
  <g filter="url(#shadow)" transform="translate(36, 30)">
    <path d="M60 0 C95 0 120 12 120 12 C120 68 95 106 60 124 C25 106 0 68 0 12 C0 12 25 0 60 0 Z" fill="url(#shield)"/>
    <!-- Inner heart & protection symbol -->
    <path d="M60 32 C48 18 28 24 28 42 C28 62 60 86 60 86 C60 86 92 62 92 42 C92 24 72 18 60 32 Z" fill="#2563eb"/>
    <!-- Trust checkmark -->
    <circle cx="60" cy="52" r="14" fill="#1d4ed8"/>
    <path d="M54 52 L58 56 L67 47" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
