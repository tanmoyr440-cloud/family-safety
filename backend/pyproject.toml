[project]
name = "family-safety-net-backend"
version = "0.1.0"
description = "Family Safety Net backend - alerts parents upon inactivity or missed loan EMI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.0",
    "tzdata>=2024.2",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "greenlet>=3.1.1",
    "python-multipart>=0.0.18",
    "pyjwt>=2.9.0",
    "jinja2>=3.1.6",
    "growwapi>=1.5.0",
    "aiosqlite>=0.22.1",
    "pypdf>=6.20.1",
]


[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "import-linter>=2.1",
    "testcontainers[postgres]>=4.9.0",
    "respx>=0.23.1",
    "pip-audit>=2.10.1",
]



[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "growwapi.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain isolation"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = [
    "app.application",
    "app.infrastructure",
    "app.interfaces",
    "app.config",
    "app.container",
    "app.main",
    "fastapi",
    "starlette",
    "pydantic",
    "pydantic_settings",
    "httpx",
    "uvicorn",
    "structlog",
]


[[tool.importlinter.contracts]]
name = "Application isolation"
type = "forbidden"
source_modules = ["app.application"]
forbidden_modules = [
    "app.infrastructure",
    "app.interfaces",
]
