services:
  db:
    image: postgres:16-alpine
    container_name: family-safety-net-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: family_safety_net
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d family_safety_net"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family-safety-net-api
    restart: unless-stopped
    environment:
      APP_NAME: "Family Safety Net API"
      ENVIRONMENT: "development"
      DATABASE_URL: "postgresql+asyncpg://postgres:postgrespassword@db:5432/family_safety_net"
      SECRET_KEY: "dev-insecure-secret-key-at-least-32-characters-long"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
