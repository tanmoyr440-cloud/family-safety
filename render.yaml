services:
  - type: web
    name: family-safety-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: alembic -c backend/alembic.ini upgrade head; uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: PYTHONPATH
        value: backend
      - key: PORT
        value: 10000
